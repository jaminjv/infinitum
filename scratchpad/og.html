<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;
  background:radial-gradient(110% 70% at 50% -10%, #10366e 0%, transparent 58%),
             radial-gradient(80% 60% at 100% 30%, #0a347c 0%, transparent 62%),
             linear-gradient(180deg,#03081a,#050e24 45%,#03081a);
  font-family:Outfit,sans-serif;color:#eaf2ff;display:flex;align-items:center;justify-content:center}
.rays{position:absolute;inset:0;overflow:hidden}
.rays i{position:absolute;top:-20%;width:2px;height:150%;
  background:linear-gradient(180deg,transparent,rgba(120,195,255,.85) 50%,transparent);
  box-shadow:0 0 24px rgba(60,150,255,.6)}
.wrap{position:relative;text-align:center;padding:0 70px}
h1{font-size:82px;font-weight:900;letter-spacing:-.035em;line-height:1.02}
h2{font-size:74px;font-weight:900;letter-spacing:-.035em;line-height:1.02;margin-top:6px}
em{font-style:normal;background:linear-gradient(120deg,#2ca6ff,#6fd6ff 60%,#a9e6ff);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:32px;font-weight:500;color:#6fd6ff;margin-top:22px}
.kick{font-family:Inter,sans-serif;font-size:22px;font-weight:500;color:#8ba3cc;
  letter-spacing:.3em;text-transform:uppercase;margin-top:26px}
.brand{position:absolute;left:64px;top:52px;font-size:34px;font-weight:800;letter-spacing:-.02em}
.brand span{color:#2ca6ff}
</style></head><body>
<div class="rays">
  <i style="left:5%;transform:rotate(14deg);opacity:.5"></i>
  <i style="left:16%;transform:rotate(17deg);opacity:.28"></i>
  <i style="left:27%;transform:rotate(11deg);opacity:.4"></i>
  <i style="left:73%;transform:rotate(-12deg);opacity:.42"></i>
  <i style="left:85%;transform:rotate(-16deg);opacity:.28"></i>
  <i style="left:95%;transform:rotate(-13deg);opacity:.5"></i>
</div>
<div class="brand">Jamin<span>.</span></div>
<div class="wrap">
  <h1>Tu página web en <em>1 día</em></h1>
  <h2>Por solo <em>$399</em></h2>
  <p class="sub">Diseño a la medida, entrega en 24 horas</p>
  <p class="kick">Y pagas cuando la recibes</p>
</div>
</body></html>
